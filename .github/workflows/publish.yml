name: Publish release

# Step 2 of a release (see release.yml). When a change to manifest.json lands
# on the default branch and its version has no tag yet, tag that commit
# v<version> and publish the GitHub release. Versions with a suffix such as
# 2.9.1b1 are published as pre-releases.
#
# Run it by hand from the Actions tab to retry a release that failed to
# publish.

on:
  push:
    branches:
      - master
      - main
    paths:
      - "custom_components/battery_sim/manifest.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"

      - name: Read version
        id: version
        run: |
          version="$(python3 -c 'import json; print(json.load(open("custom_components/battery_sim/manifest.json"))["version"])')"
          version="$(python3 scripts/bump_version.py --normalize "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists without a release; publishing the release for it."
            target=()
          else
            target=(--target "$GITHUB_SHA")
          fi
          args=(--title "$TAG" --generate-notes "${target[@]}")
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
