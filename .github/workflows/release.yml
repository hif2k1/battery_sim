name: Release

# Run from the Actions tab: enter the new version (e.g. 2.8.0). The workflow
# writes it into every file that stores the version, commits that to the
# default branch, tags the commit as v<version> and publishes a GitHub release.
# The tag therefore always points at code whose manifest matches the release,
# which is what HACS downloads.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 2.8.0"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"

      - name: Update version in all files
        id: bump
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python scripts/bump_version.py "$INPUT_VERSION"
          version="${INPUT_VERSION#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check the tag is new
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists"
            exit 1
          fi

      - name: Commit, tag and push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Version files already at $VERSION"
          else
            git commit -m "Bump version to $VERSION"
          fi
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "HEAD:$BRANCH"
          git push origin "$TAG"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.bump.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(--title "$TAG" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
