name: Release

# Step 1 of a release. Run from the Actions tab and enter the new version
# (e.g. 2.9.1). The workflow writes it into every file that stores the
# version, runs the tests and hassfest on the result, pushes that to a
# release/v<version> branch and opens a "Release v<version>" pull request.
#
# Step 2 happens on merge: publish.yml sees the new manifest version on the
# default branch, tags that commit v<version> and publishes the GitHub
# release. Nothing is pushed to the default branch directly, so this works
# with branch protection.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version, e.g. 2.9.1"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7"
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="$(python scripts/bump_version.py --normalize "$INPUT_VERSION")"
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "::error::Tag $tag already exists"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=release/$tag" >> "$GITHUB_OUTPUT"

      - name: Update version in all files
        run: python scripts/bump_version.py "${{ steps.version.outputs.version }}"

      - name: Install test dependencies
        run: pip install -r requirements_test.txt

      - name: Run tests
        run: pytest

      - name: Validate with hassfest
        uses: "home-assistant/actions/hassfest@master"

      - name: Push release branch and open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ steps.version.outputs.branch }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add custom_components
          if git diff --cached --quiet; then
            echo "::error::Version files are already at $VERSION; nothing to release"
            exit 1
          fi
          git commit -m "Bump version to $VERSION"
          git push origin "$BRANCH"
          body="Sets the version to \`$VERSION\` in every file that stores it. Tests and hassfest passed on this change in the release workflow. Merging this PR tags the merge commit \`$TAG\` and publishes the GitHub release."
          if ! gh pr create --base "$BASE" --head "$BRANCH" --title "Release $TAG" --body "$body"; then
            url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH?expand=1"
            echo "::warning::Could not open the pull request (is 'Allow GitHub Actions to create and approve pull requests' off?). Open it here: $url"
            echo "Branch $BRANCH is pushed. Open the pull request: $url" >> "$GITHUB_STEP_SUMMARY"
          fi
